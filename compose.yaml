services:
  backend:
    build: ./backend
    env_file: [.env]
    depends_on:
      db_init: {condition: service_completed_successfully}
      redis: {condition: service_started}
  db_init:
    build: ./backend
    command: sh -c "flask db upgrade && flask create-superuser"
    env_file: [.env]
    restart: "no"
  redis:
    image: redis:7-alpine
  celery_worker:
    build: ./backend
    command: celery -A app.celery_app.celery worker --loglevel=info -Q celery,ai,mail
    env_file: [.env]
    depends_on:
      db_init: {condition: service_completed_successfully}
      redis: {condition: service_started}
  celery_beat:
    build: ./backend
    command: celery -A app.celery_app.celery beat --loglevel=info
    env_file: [.env]
    depends_on:
      db_init: {condition: service_completed_successfully}
      redis: {condition: service_started}
