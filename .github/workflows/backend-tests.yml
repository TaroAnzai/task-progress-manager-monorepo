name: Backend Tests

on:
  pull_request:
    paths: ["backend/**", ".coveragerc", "pytest.ini", ".github/workflows/backend-tests.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".coveragerc", "pytest.ini", ".github/workflows/backend-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest --cov --cov-report=term-missing --cov-report=json:backend/coverage.json
      - run: python backend/check_coverage.py backend/coverage.json
