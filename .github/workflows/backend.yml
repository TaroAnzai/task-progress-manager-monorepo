name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".github/workflows/backend.yml"
      - ".github/workflows/frontend.yml"
      - ".coveragerc"
      - "pytest.ini"

  workflow_dispatch:

jobs:
  detect_backend_changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.backend.outputs.changed }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend-related changes
        id: backend
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- backend compose.yaml compose.production.yaml .github/workflows/backend.yml .coveragerc pytest.ini; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: detect_backend_changes
    if: github.event_name == 'workflow_dispatch' || needs.detect_backend_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest --cov --cov-report=term-missing --cov-report=json:backend/coverage.json

      - name: Check coverage
        run: python backend/check_coverage.py backend/coverage.json

  backend:
    needs: [detect_backend_changes, test]
    if: github.event_name == 'workflow_dispatch' || needs.detect_backend_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            cd ~/task-progress-docker
            git pull origin main
            compose=(docker compose -f compose.yaml -f compose.production.yaml)
            "${compose[@]}" config --quiet
            "${compose[@]}" up -d --build backend celery_worker celery_beat
