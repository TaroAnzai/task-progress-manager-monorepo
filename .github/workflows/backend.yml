name: Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "compose.yaml"
      - "compose.production.yaml"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            cd ~/task-progress-docker
            git pull origin main
            compose=(docker compose -f compose.yaml -f compose.production.yaml)
            "${compose[@]}" config --quiet
            "${compose[@]}" up -d --build backend celery_worker celery_beat

  frontend:
    needs: backend
    uses: ./.github/workflows/frontend.yml
    with:
      run_after_backend: true
