name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

  workflow_dispatch:

  workflow_call:
    inputs:
      run_after_backend:
        description: Deploy after a successful backend deployment
        required: false
        type: boolean
        default: false

jobs:
  detect_backend_changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.backend.outputs.changed }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' && !inputs.run_after_backend }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend-related changes
        id: backend
        if: ${{ github.event_name == 'push' && !inputs.run_after_backend }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- backend compose.yaml compose.production.yaml .github/workflows/backend.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect_backend_changes
    if: ${{ inputs.run_after_backend || github.event_name != 'push' || needs.detect_backend_changes.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    environment: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client
        working-directory: frontend
        run: npm run generate:api
        env:
          VITE_OPENAPI_URL: ${{ vars.VITE_OPENAPI_URL }}

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT }}
          source: frontend/dist/**
          target: ${{ vars.FRONTEND_DEPLOY_PATH }}
          strip_components: 2
