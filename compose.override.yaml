services:
  backend:
    command: flask run --host=0.0.0.0 --port=5000
    volumes: [./backend:/app]
    ports: ["127.0.0.1:${BACKEND_INTERNAL_PORT:-5001}:5000"]
    environment: {FLASK_ENV: development}
    networks: [default, common-identity-shared]
  dev_gateway:
    image: nginx:1.27-alpine
    depends_on:
      backend: {condition: service_started}
    ports: ["${BACKEND_PORT:-5000}:443"]
    volumes:
      - ./docker/dev-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.devcerts/auth.local.pem:/etc/nginx/certs/auth.local.pem:ro
      - ./.devcerts/auth.local-key.pem:/etc/nginx/certs/auth.local-key.pem:ro
    networks: [default]
  db_init:
    volumes: [./backend:/app]
    environment: {FLASK_ENV: development}
    depends_on:
      db: {condition: service_healthy}
  db:
    image: mysql:8.0
    env_file: [.env]
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      # A fresh MySQL volume can take several minutes to initialize on slower
      # hosts. Do not count expected startup failures as healthcheck failures.
      start_period: 10m
    restart: unless-stopped
  redis:

  celery_worker:
    volumes: [./backend:/app]
    environment: {FLASK_ENV: development}
  celery_beat:
    volumes: [./backend:/app]
    environment: {FLASK_ENV: development}
  mailhog:
    image: mailhog/mailhog
    ports: ["${MAILHOG_UI_PORT:-8026}:8025", "${MAILHOG_SMTP_PORT:-1025}:1025"]

networks:
  common-identity-shared:
    external: true

volumes:
  db_data:
  mysql_data:
