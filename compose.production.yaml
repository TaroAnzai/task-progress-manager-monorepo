services:
  backend:
    command: gunicorn --workers 4 --bind 0.0.0.0:5000 run:app
    ports: ["127.0.0.1:${BACKEND_PORT:?BACKEND_PORT is required}:5000"]
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    restart: always
  db_init:
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:?SUPERUSER_EMAIL is required}
      SUPERUSER_PASS: ${SUPERUSER_PASS:?SUPERUSER_PASS is required}
  db:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes: [mysql_data:/var/lib/mysql]
    restart: always
  redis:
    restart: always
  celery_worker:
    command: celery -A app.celery_app.celery worker -Q celery,mail,ai -n progress_worker@%h -c 2 -l info
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
    restart: always
  celery_beat:
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
    restart: always
  frontend:
    ports: ["127.0.0.1:${FRONTEND_PORT:?FRONTEND_PORT is required}:80"]
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_OPENAPI_URL: ${VITE_OPENAPI_URL:?VITE_OPENAPI_URL is required}
    restart: always
