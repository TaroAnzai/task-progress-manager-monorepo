services:
  backend:
    build: ./backend
    container_name: progress-app
    command: flask run --host=0.0.0.0 --port=5000
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    env_file:
      - ./backend/.env.dev
    depends_on:
      db_init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  db_init:
    build: ./backend
    command: sh -c "flask db upgrade && flask create-superuser"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.dev
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: mysql:8.0
    container_name: progress-db
    restart: always
    env_file:
      - ./backend/.env.dev
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    container_name: progress-redis

  celery_worker:
    build: ./backend
    container_name: progress-celery-worker
    command: celery -A app.celery_app.celery worker --loglevel=info -Q celery,ai,mail
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
    env_file:
      - ./backend/.env.dev
    depends_on:
      db_init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  celery_beat:
    build: ./backend
    container_name: progress-celery-beat
    command: celery -A app.celery_app.celery beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
    env_file:
      - ./backend/.env.dev
    depends_on:
      db_init:
        condition: service_completed_successfully
      redis:
        condition: service_started
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8026:8025" # Web UI
      - "1025:1025" # SMTP

  frontend:
    build: ./frontend
    container_name: progress-frontend
    profiles:
      - frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - DOCKER=true
    depends_on:
      - backend
volumes:
  db_data:
