services:
  backend:
    build: ./backend
    command: flask run --host=0.0.0.0 --port=5000
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=production
    env_file:
      - ./backend/.env.prod
    depends_on:
      db_init:
        condition: service_completed_successfully
    restart: always

  db_init:
    build: ./backend
    command: sh -c "flask db upgrade && flask create-superuser"
    env_file:
      - ./backend/.env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    restart: always

  db:
    image: mysql:8.0
    container_name: progress-db
    restart: always
    env_file:
      - ./backend/.env.prod
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: always

  celery_worker:
    build: ./backend
    command: >
      celery -A app.celery_app.celery worker
      -Q celery,mail,ai
      -n progress_worker@%h
      -c 2
      -l info
    env_file:
      - ./backend/.env.prod
    depends_on:
      db_init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: always

  celery_beat:
    build: ./backend
    command: celery -A app.celery_app.celery beat --loglevel=info
    env_file:
      - ./backend/.env.prod
    depends_on:
      db_init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: always

volumes:
  mysql_data:
